<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h1>Registro de Usuario</h1>
        <form id="register_form">
            <input type="text" name="nombre" placeholder="Nombre (solo texto)" required>
            <input type="text" name="apellidos" placeholder="Apellidos (solo texto)" required>
            <input type="text" name="dni" placeholder="DNI (11111111-Z)" required>
            <input type="tel" name="telefono" placeholder="Teléfono (9 dígitos)" required>
            <input type="date" name="fecha_nacimiento" placeholder="Fecha Nacimiento (aaaa-mm-dd)" required>
            <input type="email" name="email" placeholder="Email (ejemplo@servidor.extensión)" required>
            <input type="text" name="username" placeholder="Nombre de usuario" required>
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit" id="register_submit">Registrarse</button>
        </form>
        <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
